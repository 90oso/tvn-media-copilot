services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [.env]
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]
