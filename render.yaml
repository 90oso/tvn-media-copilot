services:
  - type: web
    name: tvn-media-copilot-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.9.1
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ALLOW_CACHED_GENERATION
        value: "true"
      - key: CORS_ORIGINS
        sync: false
